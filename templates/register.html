{% extends 'base.html' %}

{% block content %}
<div class="glass-panel">
    <h3 style="font-weight: 300;">ایجاد هویت جدید در سیستم</h3>
    <br>
    <form action="{{ url_for('register') }}" method="POST">
        <input type="text" name="name" placeholder="نام و نام خانوادگی کامل" required><br>
        <input type="text" name="student_id" placeholder="شناسه یکتا (شماره دانشجویی)" required autocomplete="off" 
       inputmode="numeric" 
       pattern="[0-9۰-۹]+" 
       oninvalid="this.setCustomValidity('شماره دانشجویی تنها حاوی عدد می باشد')" 
       oninput="this.setCustomValidity('')">
        <button type="submit" class="btn btn-primary">صدور کارت هوشمند</button>
    </form>
</div>
{% endblock %}
